<!DOCTYPE html>
<html lang="en">

<head>
  <script src="../../assets/js/theme-init.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2340B0" />
  <title>Students — ROYALBRIDGE INT'L SCHOOL</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>
  <div class="app-shell">
    <div class="sidebar-overlay" data-sidebar-overlay></div>
    <aside class="sidebar" data-sidebar>
      <div class="flex items-center justify-between p-md" style="border-bottom: 1px solid var(--border)">
        <div class="flex items-center gap-md">
          <img class="brand-logo" data-brand-logo alt="ROYALBRIDGE INT'L SCHOOL logo" />
          <div>
            <div class="font-semibold" data-brand-name>ROYALBRIDGE INT'L SCHOOL</div>
            <div class="text-muted text-xs">Admin</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-close>
          <i class="fas fa-times"></i>
        </button>
      </div>
      <nav class="flex-1" data-sidebar-nav></nav>
      <div class="p-md" style="border-top: 1px solid var(--border)">
        <button class="btn btn-ghost w-full" data-logout>
          <i class="fas fa-sign-out-alt"></i>
          Logout
        </button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="flex items-center gap-md">
          <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-toggle>
            <i class="fas fa-bars"></i>
          </button>
          <h1 class="card-title">Students</h1>
        </div>
        <div class="flex items-center gap-md" data-user-info></div>
      </header>
      <main class="content">
        <section class="card mb-lg">
          <div class="card-header">
            <div class="flex items-center gap-md w-full flex-wrap">
              <input class="form-input" style="max-width: 280px" id="studentSearch" placeholder="Search by name or admission number" />
              <select class="form-select" style="max-width: 220px" id="classFilter">
                <option value="">All Classes</option>
              </select>
              <button class="btn btn-secondary" id="clearFilters">Clear Filters</button>
            </div>
            <button class="btn btn-primary" data-modal-open="addStudentModal"><i class="fas fa-plus"></i> Add Student</button>
          </div>
          <div class="table-container hide-mobile">
            <table class="table">
              <thead>
                <tr>
                  <th>Admission No.</th>
                  <th>Name</th>
                  <th>Gender</th>
                  <th>Class</th>
                  <th>Arm</th>
                  <th>Parent</th>
                  <th>Phone</th>
                </tr>
              </thead>
              <tbody id="studentsTable"></tbody>
            </table>
          </div>
          <div class="list-mobile hide-desktop" id="studentsMobile"></div>
        </section>
      </main>
    </div>
    <nav class="bottom-nav" data-bottom-nav></nav>
  </div>

  <div class="modal" id="addStudentModal">
    <div class="modal-overlay" data-modal-close></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="card-title">Add Student</h2>
        <button class="btn btn-ghost btn-icon" data-modal-close><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--spacing-md)">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input class="form-input" id="firstName" required />
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input class="form-input" id="lastName" required />
          </div>
        </div>
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--spacing-md)">
          <div class="form-group">
            <label class="form-label">Date of Birth</label>
            <input class="form-input" id="dateOfBirth" type="date" />
          </div>
          <div class="form-group">
            <label class="form-label">Gender</label>
            <select class="form-select" id="gender" required>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
        </div>
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--spacing-md)">
          <div class="form-group">
            <label class="form-label">Class</label>
            <select class="form-select" id="classId" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Parent / Guardian Phone</label>
            <input class="form-input" id="guardianPhone" type="tel" required />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Parent / Guardian Name</label>
          <input class="form-input" id="guardianName" />
        </div>
        <p class="text-muted text-sm">The admission number and scratch-card PIN are generated automatically when the student is saved.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-modal-close>Cancel</button>
        <button class="btn btn-primary" id="saveStudent">Save Student</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initApp } from "../../assets/js/app.js";
    import { requireRole } from "../../assets/js/auth.js";
    import { ROLES } from "../../assets/js/config.js";
    import { studentService, classService } from "../../assets/js/services.js";
    import { query } from "../../assets/js/utils.js";
    import { toast } from "../../assets/js/notifications.js";
    import { whenDataReady, isReady } from "../../assets/js/data/store.js";
    import { showModal } from "../../assets/js/modal.js";
    import { createStudentPortalAccess, generateAdmissionNumber } from "../../assets/js/access.js";
    import { escapeHtml, loadingRow, emptyRow, setButtonLoading } from "../../assets/js/ui.js";

    initApp();
    requireRole(ROLES.ADMIN);

    function classLabel(s) {
      if (s.className) return `${s.className}${s.classArm ? " " + s.classArm : ""}`;
      const c = classService.getById(s.classId);
      return c ? `${c.name}${c.arm ? " " + c.arm : ""}` : (s.classId || "-");
    }

    function fillSelect(select, classes, keep) {
      const current = keep ? select.value : "";
      select.innerHTML = classes.map(c => `<option value="${c.classId}" data-name="${escapeHtml(c.name)}" data-arm="${escapeHtml(c.arm || "")}">${escapeHtml(c.name)}${c.arm ? " " + escapeHtml(c.arm) : ""}</option>`).join("");
      if (current && classes.some(c => c.classId === current)) select.value = current;
    }

    function render() {
      const students = studentService.getAll();
      const classes = classService.getAll();
      fillSelect(query("#classFilter"), classes, true);
      query("#classFilter").insertAdjacentHTML("afterbegin", '<option value="">All Classes</option>');
      query("#classFilter").value = query("#classFilter").value || "";

      const search = query("#studentSearch").value.toLowerCase();
      const cls = query("#classFilter").value;
      const filtered = students.filter(s => {
        const name = `${s.firstName || ""} ${s.lastName || ""}`.toLowerCase();
        const matchSearch = !search || name.includes(search) || String(s.admissionNumber || "").toLowerCase().includes(search);
        const matchCls = !cls || s.classId === cls;
        return matchSearch && matchCls;
      });

      const empty = isReady() && !filtered.length;

      query("#studentsTable").innerHTML = !isReady()
        ? loadingRow(7, "Loading students…")
        : filtered.map(s => `
        <tr>
          <td>${escapeHtml(s.admissionNumber)}</td>
          <td>${escapeHtml(`${s.firstName || ""} ${s.lastName || ""}`)}</td>
          <td>${escapeHtml(s.gender || s.sex || "-")}</td>
          <td>${escapeHtml(classLabel(s))}</td>
          <td>${escapeHtml(s.classArm || "-")}</td>
          <td>${escapeHtml(s.parentName || s.guardian?.name || "-")}</td>
          <td>${escapeHtml(s.parentPhone || s.guardian?.phone || "-")}</td>
        </tr>
      `).join("") || emptyRow(7, "No students found");

      query("#studentsMobile").innerHTML = !isReady()
        ? `<div class="text-center text-muted p-lg"><i class="fas fa-circle-notch fa-spin"></i> Loading students…</div>`
        : filtered.map(s => `
        <div class="mobile-list-item">
          <div class="mobile-list-header">
            <div class="mobile-list-title">${escapeHtml(`${s.firstName || ""} ${s.lastName || ""}`)}</div>
            <span class="badge">${escapeHtml(s.admissionNumber)}</span>
          </div>
          <div class="mobile-list-meta">Class: ${escapeHtml(classLabel(s))} • Gender: ${escapeHtml(s.gender || s.sex || "-")}</div>
          <div class="mobile-list-meta">Parent: ${escapeHtml(s.parentName || s.guardian?.name || "-")} • ${escapeHtml(s.parentPhone || s.guardian?.phone || "-")}</div>
        </div>
      `).join("") || `<div class="text-center text-muted">No students found</div>`;
    }

    function refresh() {
      fillSelect(query("#classId"), classService.getAll(), true);
      render();
    }

    async function saveStudent() {
      const btn = query("#saveStudent");
      const first = query("#firstName").value.trim();
      const last = query("#lastName").value.trim();
      const classId = query("#classId").value;
      const guardianPhone = query("#guardianPhone").value.trim();
      if (!first || !last) { toast("Enter the student's first and last name", "warning"); return; }
      if (!classId) { toast("Select a class", "warning"); return; }
      if (!guardianPhone) { toast("Enter a parent/guardian phone number", "warning"); return; }

      const clsOpt = query("#classId").selectedOptions[0];
      const className = clsOpt?.getAttribute("data-name") || "";
      const classArm = clsOpt?.getAttribute("data-arm") || null;
      const admissionNumber = generateAdmissionNumber(studentService.getAll());
      const guardianName = query("#guardianName").value.trim();

      setButtonLoading(btn, true, "Saving…");
      try {
        const student = await studentService.create({
          firstName: first,
          lastName: last,
          admissionNumber,
          dateOfBirth: query("#dateOfBirth").value || null,
          classId,
          className,
          classArm,
          gender: query("#gender").value,
          sex: query("#gender").value === "Female" ? "F" : "M",
          guardian: { name: guardianName, phone: guardianPhone },
          parentName: guardianName,
          parentPhone: guardianPhone,
          status: "active"
        });

        document.querySelector("#addStudentModal").classList.remove("active");
        refresh();

        let access = null;
        let accessError = "";
        try {
          access = await createStudentPortalAccess({
            studentId: student.studentId,
            admissionNumber: student.admissionNumber,
            displayName: `${first} ${last}`
          });
        } catch (err) {
          accessError = err.message || "Portal access could not be created.";
        }

        await showModal({
          title: access ? "Student added" : "Student added — portal pending",
          icon: access ? "fa-circle-check" : "fa-triangle-exclamation",
          variant: access ? "success" : "warning",
          html: `<p class="custom-modal-text"><strong>${escapeHtml(first)} ${escapeHtml(last)}</strong> was saved successfully.</p>
            <p class="custom-modal-text mt-sm">Admission number: <strong>${escapeHtml(admissionNumber)}</strong></p>
            ${access
              ? `<p class="custom-modal-text mt-sm">Scratch card PIN: <strong style="font-size:1.25rem;letter-spacing:2px">${escapeHtml(access.pin)}</strong></p>
                 <p class="text-muted text-sm mt-sm">Give this PIN to the student once. It is not shown again.</p>`
              : `<p class="custom-modal-text mt-sm text-danger">${escapeHtml(accessError)}</p>
                 <p class="text-muted text-sm">You can retry portal access from the student record later.</p>`}`,
          buttons: [{ label: "Done", variant: "primary", value: true, autofocus: true }]
        });

        query("#firstName").value = "";
        query("#lastName").value = "";
        query("#dateOfBirth").value = "";
        query("#guardianName").value = "";
        query("#guardianPhone").value = "";
      } catch (err) {
        toast(err.message || "Could not save the student", "error");
      } finally {
        setButtonLoading(btn, false);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      refresh();
      whenDataReady().then(refresh);
      query("#studentSearch").addEventListener("input", render);
      query("#classFilter").addEventListener("change", render);
      query("#clearFilters").addEventListener("click", () => { query("#studentSearch").value=""; query("#classFilter").value=""; render(); });
      query("#saveStudent").addEventListener("click", saveStudent);
    });
  </script>
</body>

</html>
