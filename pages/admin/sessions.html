<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sessions — ROYALBRIDGE INT'L SCHOOL</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-overlay" data-sidebar-overlay></div>
    <aside class="sidebar" data-sidebar>
      <div class="flex items-center justify-between p-md" style="border-bottom:1px solid var(--border)">
        <div class="flex items-center gap-md">
          <img class="brand-logo" data-brand-logo alt="ROYALBRIDGE INT'L SCHOOL logo" />
          <div><div class="font-semibold" data-brand-name>ROYALBRIDGE INT'L SCHOOL</div><div class="text-muted text-xs">Admin</div></div>
        </div>
        <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-close><i class="fas fa-times"></i></button>
      </div>
      <nav class="flex-1" data-sidebar-nav></nav>
      <div class="p-md" style="border-top:1px solid var(--border)"><button class="btn btn-ghost w-full" data-logout><i class="fas fa-sign-out-alt"></i> Logout</button></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="flex items-center gap-md">
          <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-toggle><i class="fas fa-bars"></i></button>
          <h1 class="card-title">Sessions & Terms</h1>
        </div>
        <div class="flex items-center gap-md" data-user-info></div>
      </header>
      <main class="content">
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:var(--spacing-lg)">
          <div class="card">
            <div class="card-header"><h2 class="card-title">Sessions</h2></div>
            <div id="sessions"></div>
          </div>
          <div class="card">
            <div class="card-header"><h2 class="card-title">Terms</h2></div>
            <div id="terms"></div>
          </div>
        </div>
      </main>
    </div>
    <nav class="bottom-nav" data-bottom-nav></nav>
  </div>
  <script type="module">
    import { initApp } from "../../assets/js/app.js";
    import { requireRole } from "../../assets/js/auth.js";
    import { ROLES } from "../../assets/js/config.js";
    import { sessionService } from "../../assets/js/services.js";
    import { whenDataReady, list } from "../../assets/js/data/store.js";

    initApp();
    requireRole(ROLES.ADMIN);

    function render() {
      const sessions = sessionService.getAll();
      const terms = list("terms");
      document.getElementById("sessions").innerHTML = sessions.map(x => `<div class="p-md" style="border-bottom:1px solid var(--border)"><div>${x.name} ${x.current ? '<span class="badge badge-success">Current</span>' : ''}</div></div>`).join("") || '<p class="text-muted">No sessions</p>';
      document.getElementById("terms").innerHTML = terms.map(x => `<div class="p-md" style="border-bottom:1px solid var(--border)"><div>${x.name} ${x.current ? '<span class="badge badge-success">Current</span>' : ''}</div></div>`).join("") || '<p class="text-muted">No terms</p>';
    }

    document.addEventListener("DOMContentLoaded", () => { render(); whenDataReady().then(render); });
  </script>
</body>
</html>
