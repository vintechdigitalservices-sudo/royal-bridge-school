<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subjects — ROYALBRIDGE INT'L SCHOOL</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-overlay" data-sidebar-overlay></div>
    <aside class="sidebar" data-sidebar>
      <div class="flex items-center justify-between p-md" style="border-bottom:1px solid var(--border)">
        <div class="flex items-center gap-md">
          <img class="brand-logo" data-brand-logo alt="ROYALBRIDGE INT'L SCHOOL logo" />
          <div><div class="font-semibold" data-brand-name>ROYALBRIDGE INT'L SCHOOL</div><div class="text-muted text-xs">Admin</div></div>
        </div>
        <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-close><i class="fas fa-times"></i></button>
      </div>
      <nav class="flex-1" data-sidebar-nav></nav>
      <div class="p-md" style="border-top:1px solid var(--border)"><button class="btn btn-ghost w-full" data-logout><i class="fas fa-sign-out-alt"></i> Logout</button></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="flex items-center gap-md">
          <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-toggle><i class="fas fa-bars"></i></button>
          <h1 class="card-title">Subjects</h1>
        </div>
        <div class="flex items-center gap-md" data-user-info></div>
      </header>
      <main class="content">
        <div class="card">
          <div class="card-header"><h2 class="card-title">Subjects</h2><button class="btn btn-primary" data-modal-open="addSubjModal"><i class="fas fa-plus"></i> Add Subject</button></div>
          <div class="table-container"><table class="table"><thead><tr><th>Name</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div>
        </div>
      </main>
    </div>
    <nav class="bottom-nav" data-bottom-nav></nav>
  </div>
  <div class="modal" id="addSubjModal">
    <div class="modal-overlay" data-modal-close></div>
    <div class="modal-content">
      <div class="modal-header"><h2 class="card-title">Add Subject</h2><button class="btn btn-ghost btn-icon" data-modal-close><i class="fas fa-times"></i></button></div>
      <div class="modal-body"><div class="form-group"><label class="form-label">Subject Name</label><input class="form-input" id="name" required /></div></div>
      <div class="modal-footer"><button class="btn btn-secondary" data-modal-close>Cancel</button><button class="btn btn-primary" id="save">Save</button></div>
    </div>
  </div>
  <script type="module">import {initApp} from "../../assets/js/app.js"; import {requireRole} from "../../assets/js/auth.js"; import {ROLES} from "../../assets/js/config.js"; import {subjectService} from "../../assets/js/services.js"; import {query} from "../../assets/js/utils.js"; import {toast} from "../../assets/js/notifications.js"; import {whenDataReady} from "../../assets/js/data/store.js"; initApp(); requireRole(ROLES.ADMIN); function render(){const list=subjectService.getAll(); query("#tbody").innerHTML=list.map(s=>`<tr><td>${s.name}</td><td>${s.active?'<span class="badge badge-success">Active</span>':'<span class="badge">Inactive</span>'}</td></tr>`).join("");} document.addEventListener("DOMContentLoaded",()=>{render(); whenDataReady().then(render); query("#save").addEventListener("click",()=>{subjectService.create({name:query("#name").value, active:true}); toast("Subject added","success"); document.getElementById("addSubjModal").classList.remove("active"); render();});});</script>
</body>
</html>
