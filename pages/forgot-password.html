<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — ROYALBRIDGE INT'L SCHOOL</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>
  <div class="flex items-center justify-center h-full p-md auth-screen">
    <div class="card" style="width: 100%; max-width: 420px">
      <div class="text-center mb-lg">
        <h1 class="card-title">Forgot Password</h1>
        <p class="text-muted">Enter your email to receive reset instructions</p>
      </div>
      <form id="forgotForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" required />
        </div>
        <button class="btn btn-primary w-full" type="submit">Send Reset Link</button>
      </form>
      <div class="text-center mt-md">
        <a href="../index.html" class="text-sm text-muted">Back to login</a>
      </div>
    </div>
  </div>
  <script type="module">
    import { showAlert } from "../assets/js/modal.js";
    import { sendPasswordReset } from "../assets/js/auth.js";
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const btn = e.target.querySelector("button[type=submit]");
      btn.disabled = true;
      try {
        await sendPasswordReset(email);
        await showAlert("If that email is registered, a password reset link has been sent to it.", {
          title: "Reset Link Sent", icon: "fa-paper-plane", variant: "success"
        });
        window.location.href = "../index.html";
      } catch (err) {
        await showAlert("We could not send a reset link. Check the email address and try again.", {
          title: "Could Not Send", icon: "fa-triangle-exclamation", variant: "danger"
        });
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
