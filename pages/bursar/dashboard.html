<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — ROYALBRIDGE INT'L SCHOOL</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-overlay" data-sidebar-overlay></div>
    <aside class="sidebar" data-sidebar>
      <div class="flex items-center justify-between p-md" style="border-bottom:1px solid var(--border)">
        <div class="flex items-center gap-md">
          <img class="brand-logo" data-brand-logo alt="ROYALBRIDGE INT'L SCHOOL logo" />
          <div><div class="font-semibold" data-brand-name>ROYALBRIDGE INT'L SCHOOL</div><div class="text-muted text-xs">Bursar</div></div>
        </div>
        <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-close><i class="fas fa-times"></i></button>
      </div>
      <nav class="flex-1" data-sidebar-nav></nav>
      <div class="p-md" style="border-top:1px solid var(--border)"><button class="btn btn-ghost w-full" data-logout><i class="fas fa-sign-out-alt"></i> Logout</button></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="flex items-center gap-md">
          <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-toggle><i class="fas fa-bars"></i></button>
          <h1 class="card-title">Dashboard</h1>
        </div>
        <div class="flex items-center gap-md" data-user-info></div>
      </header>
      <main class="content">
        <section class="grid grid-stats mb-lg">
          <article class="stat-card"><span class="stat-label">Total Collected</span><span class="stat-value" data-collected>-</span></article>
          <article class="stat-card"><span class="stat-label">Payments</span><span class="stat-value" data-count>-</span></article>
        </section>
        <section class="card">
          <div class="card-header"><h2 class="card-title">Recent Payments</h2></div>
          <div class="table-container"><table class="table"><thead><tr><th>Receipt</th><th>Student</th><th>Amount</th><th>Date</th><th>Method</th></tr></thead><tbody data-tbody></tbody></table></div>
        </section>
      </main>
    </div>
    <nav class="bottom-nav" data-bottom-nav></nav>
  </div>
  <script type="module">
    import {initApp} from "../../assets/js/app.js";
    import {requireRole} from "../../assets/js/auth.js";
    import {ROLES} from "../../assets/js/config.js";
    import {paymentService} from "../../assets/js/services.js";
    import {formatCurrency, formatDate} from "../../assets/js/utils.js";
    import {whenDataReady} from "../../assets/js/data/store.js";
    initApp(); requireRole(ROLES.BURSAR);
    function render(){
      const p=paymentService.getAll();
      document.querySelector("[data-count]").textContent=p.length;
      document.querySelector("[data-collected]").textContent=formatCurrency(p.reduce((s,x)=>s+(Number(x.amount)||0),0));
      document.querySelector("[data-tbody]").innerHTML=p.slice(0,10).map(x=>`<tr><td>${x.receiptNumber}</td><td>${x.student||"-"}</td><td>${formatCurrency(x.amount)}</td><td>${formatDate(x.paymentDate)}</td><td>${x.paymentMethod}</td></tr>`).join("")||`<tr><td colspan="5" class="text-center text-muted">No payments</td></tr>`;
    }
    document.addEventListener("DOMContentLoaded",()=>{render(); whenDataReady().then(render);});
  </script>
</body>
</html>
