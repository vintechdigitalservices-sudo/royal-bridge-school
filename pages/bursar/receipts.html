<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receipts — ROYALBRIDGE INT'L SCHOOL</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-overlay" data-sidebar-overlay></div>
    <aside class="sidebar" data-sidebar>
      <div class="flex items-center justify-between p-md" style="border-bottom:1px solid var(--border)">
        <div class="flex items-center gap-md">
          <img class="brand-logo" data-brand-logo alt="ROYALBRIDGE INT'L SCHOOL logo" />
          <div><div class="font-semibold" data-brand-name>ROYALBRIDGE INT'L SCHOOL</div><div class="text-muted text-xs">Bursar</div></div>
        </div>
        <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-close><i class="fas fa-times"></i></button>
      </div>
      <nav class="flex-1" data-sidebar-nav></nav>
      <div class="p-md" style="border-top:1px solid var(--border)"><button class="btn btn-ghost w-full" data-logout><i class="fas fa-sign-out-alt"></i> Logout</button></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="flex items-center gap-md">
          <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-toggle><i class="fas fa-bars"></i></button>
          <h1 class="card-title">Receipts</h1>
        </div>
        <div class="flex items-center gap-md" data-user-info></div>
      </header>
      <main class="content">
        <div class="card">
          <div class="card-header"><h2 class="card-title">Recent Receipts</h2></div>
          <div class="table-container"><table class="table"><thead><tr><th>Receipt No.</th><th>Student</th><th>Amount</th><th>Date</th><th>Action</th></tr></thead><tbody id="tbody"></tbody></table></div>
        </div>
      </main>
    </div>
    <nav class="bottom-nav" data-bottom-nav></nav>
  </div>
  <script type="module">
    import {initApp} from "../../assets/js/app.js";
    import {requireRole} from "../../assets/js/auth.js";
    import {ROLES} from "../../assets/js/config.js";
    import {paymentService} from "../../assets/js/services.js";
    import {formatCurrency, formatDate} from "../../assets/js/utils.js";
    import {showModal} from "../../assets/js/modal.js";
    import {whenDataReady} from "../../assets/js/data/store.js";
    initApp(); requireRole(ROLES.BURSAR);
    function render(){
      const p=paymentService.getAll();
      const tbody=document.getElementById("tbody");
      tbody.innerHTML=p.map(x=>`<tr><td>${x.receiptNumber}</td><td>${x.student||"-"}</td><td>${formatCurrency(x.amount)}</td><td>${formatDate(x.paymentDate)}</td><td><button class="btn btn-sm btn-secondary" data-print="${x.receiptNumber}" data-student="${x.student||"-"}" data-amount="${formatCurrency(x.amount)}">Print</button></td></tr>`).join("")||'<tr><td colspan="5" class="text-center text-muted">No receipts</td></tr>';
      tbody.querySelectorAll("[data-print]").forEach(btn=>btn.addEventListener("click",()=>{
        showModal({
          title:"Receipt "+btn.getAttribute("data-print"),
          icon:"fa-receipt", variant:"success",
          html:`<p><strong>${btn.getAttribute("data-student")}</strong></p><p>Amount: ${btn.getAttribute("data-amount")}</p>`,
          buttons:[{label:"Close", variant:"secondary", value:true},{label:"Print", variant:"primary", value:"print", autofocus:true}]
        }).then(v=>{ if(v==="print") window.print(); });
      }));
    }
    document.addEventListener("DOMContentLoaded",()=>{ render(); whenDataReady().then(render); });
  </script>
</body>
</html>
