<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payments — ROYALBRIDGE INT'L SCHOOL</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-overlay" data-sidebar-overlay></div>
    <aside class="sidebar" data-sidebar>
      <div class="flex items-center justify-between p-md" style="border-bottom:1px solid var(--border)">
        <div class="flex items-center gap-md">
          <img class="brand-logo" data-brand-logo alt="ROYALBRIDGE INT'L SCHOOL logo" />
          <div><div class="font-semibold" data-brand-name>ROYALBRIDGE INT'L SCHOOL</div><div class="text-muted text-xs">Bursar</div></div>
        </div>
        <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-close><i class="fas fa-times"></i></button>
      </div>
      <nav class="flex-1" data-sidebar-nav></nav>
      <div class="p-md" style="border-top:1px solid var(--border)"><button class="btn btn-ghost w-full" data-logout><i class="fas fa-sign-out-alt"></i> Logout</button></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="flex items-center gap-md">
          <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-toggle><i class="fas fa-bars"></i></button>
          <h1 class="card-title">Record Payment</h1>
        </div>
        <div class="flex items-center gap-md" data-user-info></div>
      </header>
      <main class="content">
        <div class="card" style="max-width:600px">
          <div class="card-body">
            <div class="form-group"><label class="form-label">Student</label><select class="form-select" id="student"></select></div>
            <div class="grid" style="grid-template-columns:1fr 1fr; gap:var(--spacing-md)">
              <div class="form-group"><label class="form-label">Amount</label><input class="form-input" type="number" id="amount" /></div>
              <div class="form-group"><label class="form-label">Payment Method</label><select class="form-select" id="method"><option>Cash</option><option>Bank Transfer</option><option>POS</option><option>Other</option></select></div>
            </div>
            <div class="form-group"><label class="form-label">Fee Category</label><input class="form-input" id="fee" value="Tuition" /></div>
            <div class="form-group"><label class="form-label">Notes</label><textarea class="form-textarea" id="notes"></textarea></div>
            <button class="btn btn-primary" id="save">Record Payment</button>
          </div>
        </div>
      </main>
    </div>
    <nav class="bottom-nav" data-bottom-nav></nav>
  </div>
  <script type="module">
    import {initApp} from "../../assets/js/app.js";
    import {requireRole} from "../../assets/js/auth.js";
    import {ROLES} from "../../assets/js/config.js";
    import {studentService, paymentService, userService, notificationService} from "../../assets/js/services.js";
    import {query, formatCurrency} from "../../assets/js/utils.js";
    import {toast} from "../../assets/js/notifications.js";
    import {whenDataReady} from "../../assets/js/data/store.js";
    initApp(); requireRole(ROLES.BURSAR);
    function renderStudents(){ query("#student").innerHTML=studentService.getAll().map(s=>`<option value="${s.studentId}">${s.firstName} ${s.lastName} (${s.admissionNumber})</option>`).join(""); }
    document.addEventListener("DOMContentLoaded",()=>{
      renderStudents(); whenDataReady().then(renderStudents);
      query("#save").addEventListener("click",()=>{
        const studentId=query("#student").value;
        const p=paymentService.record({studentId, amount:query("#amount").value, paymentMethod:query("#method").value, feeCategory:query("#fee").value, notes:query("#notes").value});
        const student=studentService.getById(studentId);
        const name=student?`${student.firstName} ${student.lastName}`:"a student";
        const amount=formatCurrency(p.amount);
        notificationService.createForUsers(userService.getByRole(ROLES.ADMIN).map(u=>u.userId),{
          title:"New Payment Recorded",
          message:`${amount} recorded for ${name} (${p.feeCategory}). Receipt ${p.receiptNumber}.`,
          type:"payment", link:"pages/admin/payments.html"
        });
        notificationService.createForUsers(userService.getAll().filter(u=>u.studentId===studentId).map(u=>u.userId),{
          title:"Payment Recorded",
          message:`A payment of ${amount} for ${name} was recorded. Receipt ${p.receiptNumber}.`,
          type:"payment", link:"pages/student/receipts.html"
        });
        toast(`Payment recorded. Receipt: ${p.receiptNumber}`,"success");
        query("#amount").value=""; query("#notes").value="";
      });
    });
  </script>
</body>
</html>
