<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../assets/js/theme-init.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students — ROYALBRIDGE INT'L SCHOOL</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-overlay" data-sidebar-overlay></div>
    <aside class="sidebar" data-sidebar>
      <div class="flex items-center justify-between p-md" style="border-bottom:1px solid var(--border)">
        <div class="flex items-center gap-md">
          <img class="brand-logo" data-brand-logo alt="ROYALBRIDGE INT'L SCHOOL logo" />
          <div><div class="font-semibold" data-brand-name>ROYALBRIDGE INT'L SCHOOL</div><div class="text-muted text-xs">Bursar</div></div>
        </div>
        <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-close><i class="fas fa-times"></i></button>
      </div>
      <nav class="flex-1" data-sidebar-nav></nav>
      <div class="p-md" style="border-top:1px solid var(--border)"><button class="btn btn-ghost w-full" data-logout><i class="fas fa-sign-out-alt"></i> Logout</button></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="flex items-center gap-md">
          <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-toggle><i class="fas fa-bars"></i></button>
          <h1 class="card-title">Students</h1>
        </div>
        <div class="flex items-center gap-md" data-user-info></div>
      </header>
      <main class="content">
        <div class="card">
          <div class="card-header" style="flex-wrap:wrap; gap:var(--spacing-sm)">
            <input class="form-input" style="max-width:280px" id="search" placeholder="Search by name/admission number" />
            <select class="form-select" style="max-width:200px" id="classFilter">
              <option value="">All Classes</option>
            </select>
          </div>
          <div class="table-container hide-mobile"><table class="table"><thead><tr><th>Admission</th><th>Name</th><th>Class</th><th>Phone</th></tr></thead><tbody id="tbody"></tbody></table></div>
          <div class="list-mobile hide-desktop" id="studentList"></div>
        </div>
      </main>
    </div>
    <nav class="bottom-nav" data-bottom-nav></nav>
  </div>
  <script type="module">
    import {initApp} from "../../assets/js/app.js";
    import {requireRole} from "../../assets/js/auth.js";
    import {ROLES} from "../../assets/js/config.js";
    import {studentService, classService} from "../../assets/js/services.js";
    import {query} from "../../assets/js/utils.js";
    import {whenDataReady, isReady} from "../../assets/js/data/store.js";
    import {escapeHtml, loadingRow, emptyRow} from "../../assets/js/ui.js";
    initApp(); requireRole(ROLES.BURSAR);
    function populateClasses(){
      const classes = classService.getAll();
      const sel = query("#classFilter");
      const current = sel.value;
      sel.innerHTML = '<option value="">All Classes</option>' + classes.map(c=>`<option value="${c.classId}">${escapeHtml(c.name)}${c.arm?" "+escapeHtml(c.arm):""}</option>`).join("");
      if (current && classes.some(c=>c.classId===current)) sel.value = current;
    }
    function classLabel(x){
      return x.className ? `${x.className}${x.classArm?" "+x.classArm:""}` : (classService.getById(x.classId) ? `${classService.getById(x.classId).name}${classService.getById(x.classId).arm?" "+classService.getById(x.classId).arm:""}` : "-");
    }
    function render(){
      populateClasses();
      if(!isReady()){
        query("#tbody").innerHTML = loadingRow(4,"Loading students…");
        query("#studentList").innerHTML = `<div class="text-center text-muted p-lg"><i class="fas fa-circle-notch fa-spin"></i> Loading students…</div>`;
        return;
      }
      const list = studentService.getAll();
      const s = (query("#search").value || "").toLowerCase();
      const cls = query("#classFilter").value;
      const f = list.filter(x=>{
        if(cls && x.classId !== cls) return false;
        if(!s) return true;
        const name = `${x.firstName||""} ${x.lastName||""}`.toLowerCase();
        return name.includes(s) || (x.admissionNumber||"").toLowerCase().includes(s);
      });
      query("#tbody").innerHTML = f.map(x=>`<tr><td>${escapeHtml(x.admissionNumber||"-")}</td><td>${escapeHtml(`${x.firstName||""} ${x.lastName||""}`)}</td><td>${escapeHtml(classLabel(x))}</td><td>${escapeHtml(x.parentPhone||x.guardian?.phone||x.guardianPhone||"-")}</td></tr>`).join("") || emptyRow(4,"No students found");
      query("#studentList").innerHTML = f.map(x=>`<div class="mobile-list-item"><div class="mobile-list-header"><div class="mobile-list-title">${escapeHtml(`${x.firstName||""} ${x.lastName||""}`)}</div><span class="badge">${escapeHtml(x.admissionNumber||"-")}</span></div><div class="mobile-list-meta">${escapeHtml(classLabel(x))}</div><div class="mobile-list-meta">${escapeHtml(x.parentPhone||x.guardian?.phone||"-")}</div></div>`).join("") || `<div class="text-center text-muted">No students found</div>`;
    }
    document.addEventListener("DOMContentLoaded",()=>{
      render();
      whenDataReady().then(render);
      query("#search").addEventListener("input",render);
      query("#classFilter").addEventListener("change",render);
    });
  </script>
</body>
</html>
