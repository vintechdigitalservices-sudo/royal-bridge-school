<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activate Account — ROYALBRIDGE INT'L SCHOOL</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>
  <div class="flex items-center justify-center h-full p-md auth-screen">
    <div class="card" style="width: 100%; max-width: 420px">
      <div class="text-center mb-lg">
        <h1 class="card-title">Activate Account</h1>
        <p class="text-muted">Set your password using activation code</p>
      </div>
      <form id="activateForm">
        <div class="form-group">
          <label class="form-label" for="token">Activation Code</label>
          <input class="form-input" id="token" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">New Password</label>
          <input class="form-input" type="password" id="password" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm">Confirm Password</label>
          <input class="form-input" type="password" id="confirm" required />
        </div>
        <button class="btn btn-primary w-full" type="submit">Activate Account</button>
      </form>
      <div class="text-center mt-md">
        <a href="../index.html" class="text-sm text-muted">Back to login</a>
      </div>
    </div>
  </div>
  <script type="module">
    import { showModal, showAlert } from "../assets/js/modal.js";
    import { initPasswordToggles } from "../assets/js/forms.js";

    initPasswordToggles();
    const form = document.getElementById("activateForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password !== confirm) {
        await showAlert("The two passwords do not match. Please try again.", { title: "Passwords don't match", icon: "fa-triangle-exclamation", variant: "warning" });
        return;
      }

      await showAlert("Your account has been activated successfully. You can now log in with your new password.", {
        title: "Account Activated", icon: "fa-circle-check", variant: "success"
      });

      if ("Notification" in window && Notification.permission === "default") {
        const enabled = await showModal({
          title: "Enable Notifications",
          icon: "fa-bell",
          html: `<p>Stay updated with announcements, results, fee payments and account activity. Would you like to enable notifications?</p>`,
          buttons: [
            { label: "Not now", variant: "secondary", value: false },
            { label: "Enable Notifications", variant: "primary", value: true, autofocus: true }
          ]
        });
        localStorage.setItem("rbi_notification_prompt_decided", "1");
        if (enabled) {
          try {
            const res = await Notification.requestPermission();
            if (res === "granted") new Notification("ROYALBRIDGE INT'L SCHOOL", { body: "Notifications are now enabled.", icon: "../assets/images/icon-192.png" });
          } catch (err) { /* no-op */ }
        }
      }

      window.location.href = "../index.html";
    });
  </script>
</body>

</html>
