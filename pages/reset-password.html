<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — ROYALBRIDGE INT'L SCHOOL</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>
  <div class="flex items-center justify-center h-full p-md" style="min-height: 100vh; background: var(--background)">
    <div class="card" style="width: 100%; max-width: 420px">
      <div class="text-center mb-lg">
        <h1 class="card-title">Reset Password</h1>
        <p class="text-muted">Set a new password</p>
      </div>
      <form id="resetForm">
        <div class="form-group">
          <label class="form-label" for="token">Reset Token</label>
          <input class="form-input" id="token" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">New Password</label>
          <input class="form-input" type="password" id="password" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm">Confirm Password</label>
          <input class="form-input" type="password" id="confirm" required />
        </div>
        <button class="btn btn-primary w-full" type="submit">Reset Password</button>
      </form>
      <div class="text-center mt-md">
        <a href="../index.html" class="text-sm text-muted">Back to login</a>
      </div>
    </div>
  </div>
  <script type="module">
    import { showAlert } from "../assets/js/modal.js";
    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password !== confirm) {
        await showAlert("The two passwords do not match. Please try again.", { title: "Passwords don't match", icon: "fa-triangle-exclamation", variant: "warning" });
        return;
      }
      await showAlert("Your password has been reset successfully. Please log in with your new password.", {
        title: "Password Reset", icon: "fa-circle-check", variant: "success"
      });
      window.location.href = "../index.html";
    });
  </script>
</body>

</html>
