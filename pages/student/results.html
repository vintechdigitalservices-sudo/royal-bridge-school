<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../assets/js/theme-init.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2340B0" />
  <title>Check Results — ROYALBRIDGE INT'L SCHOOL</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-overlay" data-sidebar-overlay></div>
    <aside class="sidebar" data-sidebar>
      <div class="flex items-center justify-between p-md" style="border-bottom:1px solid var(--border)">
        <div class="flex items-center gap-md">
          <img class="brand-logo" data-brand-logo alt="ROYALBRIDGE INT'L SCHOOL logo" />
          <div><div class="font-semibold" data-brand-name>ROYALBRIDGE INT'L SCHOOL</div><div class="text-muted text-xs">Student</div></div>
        </div>
        <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-close><i class="fas fa-times"></i></button>
      </div>
      <nav class="flex-1" data-sidebar-nav></nav>
      <div class="p-md" style="border-top:1px solid var(--border)"><button class="btn btn-ghost w-full" data-logout><i class="fas fa-sign-out-alt"></i> Logout</button></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="flex items-center gap-md">
          <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-toggle><i class="fas fa-bars"></i></button>
          <h1 class="card-title">Check Results</h1>
        </div>
        <div class="flex items-center gap-md" data-user-info></div>
      </header>
      <main class="content">
        <section class="card">
          <div class="card-header" style="flex-wrap:wrap">
            <div class="flex items-center gap-md flex-wrap">
              <select class="form-select" style="max-width:200px" id="sessionSel">
                <option value="">Loading…</option>
              </select>
              <select class="form-select" style="max-width:200px" id="classSel">
                <option value="">Loading…</option>
              </select>
              <select class="form-select" style="max-width:200px" id="termSel">
                <option value="First Term">First Term</option>
                <option value="Second Term">Second Term</option>
                <option value="Third Term">Third Term</option>
              </select>
            </div>
            <div class="flex items-center gap-sm">
              <a class="btn btn-secondary" id="cumulativeBtn" style="display:none" href="#"><i class="fas fa-layer-group"></i> Cumulative</a>
              <a class="btn btn-primary" id="reportBtn" style="display:none" href="#"><i class="fas fa-file-lines"></i> Full Report Sheet</a>
            </div>
          </div>
          <div id="summary" class="text-muted mb-md">Loading…</div>
          <div class="table-container">
            <table class="table">
              <thead><tr><th>Subject</th><th data-ca-th>C/A 20</th><th data-mid-th>Mid 20</th><th data-exam-th>Exam 60</th><th data-total-th>Total 100</th><th>Remark</th></tr></thead>
              <tbody id="tbody"><tr><td colspan="6" class="text-center text-muted"><i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i> Loading…</td></tr></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <nav class="bottom-nav" data-bottom-nav></nav>
  </div>
  <script type="module">
    import { initApp } from "../../assets/js/app.js";
    import { requireRole, getCurrentUser } from "../../assets/js/auth.js";
    import { ROLES } from "../../assets/js/config.js";
    import { resultService, sessionService, classService } from "../../assets/js/services.js";
    import { buildReportModel, getWeights, classLabel } from "../../assets/js/reporting.js";
    import { query } from "../../assets/js/utils.js";
    import { whenDataReady } from "../../assets/js/data/store.js";
    import { escapeHtml } from "../../assets/js/ui.js";

    initApp();
    requireRole(ROLES.STUDENT);

    function classOptions() {
      return classService.getAll();
    }

    function sessionLabel(sess) {
      return sess ? `${sess.name}${sess.current ? " (current)" : ""}` : "-";
    }

    function classLabelFor(s) {
      return classLabel(s.classId) || s.classId || "-";
    }

    function render() {
      const u = getCurrentUser();
      const s = u && u.student;
      const tbody = query("#tbody");
      const summary = query("#summary");
      const reportBtn = query("#reportBtn");
      const cumulativeBtn = query("#cumulativeBtn");
      reportBtn.style.display = "none";
      cumulativeBtn.style.display = "none";

      if (!s) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No student record linked.</td></tr>`;
        summary.textContent = "";
        return;
      }

      // keep selectors consistent with available data
      const sessions = sessionService.getAll();
      const sessionSel = query("#sessionSel");
      const currentVal = sessionSel.value;
      sessionSel.innerHTML = sessions.map((x) => `<option value="${escapeHtml(x.sessionId)}">${escapeHtml(sessionLabel(x))}</option>`).join("") || `<option value="">—</option>`;
      const current = sessions.find((x) => x.current);
      const val = currentVal && sessions.some((x) => x.sessionId === currentVal) ? currentVal : (current ? current.sessionId : (sessions[0] ? sessions[0].sessionId : ""));
      sessionSel.value = val;

      const classes = classOptions();
      const classSel = query("#classSel");
      const currentClassVal = classSel.value;
      classSel.innerHTML = classes.map((c) => `<option value="${escapeHtml(c.classId)}">${escapeHtml(classLabel(c.classId))}</option>`).join("") || `<option value="">—</option>`;
      const cv = currentClassVal && classes.some((c) => c.classId === currentClassVal) ? currentClassVal : (s.classId || (classes[0] ? classes[0].classId : ""));
      classSel.value = cv;

      const sessionId = sessionSel.value || "";
      const classId = classSel.value || "";
      const term = query("#termSel").value;
      const weights = getWeights();
      query("[data-ca-th]").textContent = `C/A ${weights.ca}`;
      query("[data-mid-th]").textContent = `Mid ${weights.mid}`;
      query("[data-exam-th]").textContent = `Exam ${weights.exam}`;
      query("[data-total-th]").textContent = `Total ${weights.ca + weights.mid + weights.exam}`;

      // A result must belong to this exact student, session and term.
      const matches = resultService
        .getByStudent(s.studentId)
        .filter((r) => r.sessionId === sessionId && r.termName === term);

      const published = matches.filter((r) => /published/i.test(r.status || ""));
      const show = published.find((r) => r.classId === classId) || published[0] || null;

      if (!matches.length) {
        // No result record exists for this session + class + term combination.
        summary.innerHTML = `<strong>${escapeHtml(`${s.firstName || ""} ${s.lastName || ""}`)}</strong> · ${escapeHtml(classLabelFor(s))} · ${escapeHtml(term)}`;
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No Result Record Found</td></tr>`;
        return;
      }

      if (!show) {
        // A result exists for this selection but the school has not published it yet.
        summary.innerHTML = `<strong>${escapeHtml(`${s.firstName || ""} ${s.lastName || ""}`)}</strong> · ${escapeHtml(classLabelFor(s))} · ${escapeHtml(term)}`;
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted"><i class="fas fa-hourglass-half" aria-hidden="true"></i> Result Not Yet Available</td></tr>`;
        return;
      }

      summary.innerHTML = `<strong>${escapeHtml(`${s.firstName || ""} ${s.lastName || ""}`)}</strong> · ${escapeHtml(classLabelFor(s))} · ${escapeHtml(`${sessionLabel(sessions.find((x) => x.sessionId === sessionId))} · ${term}`)}`;

      const model = buildReportModel({ studentId: s.studentId, classId: show.classId, termName: term, reportType: "termly" });
      if (!model || !model.academic || !model.academic.rows.some((r) => !r.missing)) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No result rows available.</td></tr>`;
        return;
      }

      summary.innerHTML += ` · Average: <strong>${model.academic.average}</strong>`
        + (model.position ? ` · Position: <strong>${model.position}</strong>` : "");

      tbody.innerHTML = model.academic.rows.map((r) => `
        <tr>
          <td>${escapeHtml(r.label)}</td>
          <td>${r.ca ?? "—"}</td>
          <td>${r.mid ?? "—"}</td>
          <td>${r.exam ?? "—"}</td>
          <td><strong>${r.total ?? "—"}</strong></td>
          <td>${escapeHtml(r.remark || "—")}</td>
        </tr>
      `).join("");

      const base = `../reports/view.html?studentId=${encodeURIComponent(s.studentId)}&classId=${encodeURIComponent(show.classId)}`;
      reportBtn.href = `${base}&term=${encodeURIComponent(term)}&type=termly`;
      reportBtn.style.display = "";

      const cumulativeTarget = published.find((r) => r.termSlug === "third-term");
      if (cumulativeTarget) {
        cumulativeBtn.href = `${base}&type=cumulative`;
        cumulativeBtn.style.display = "";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      render();
      query("#termSel").addEventListener("change", render);
      query("#sessionSel").addEventListener("change", render);
      query("#classSel").addEventListener("change", render);
      whenDataReady().then(render);
    });
  </script>
</body>
</html>
