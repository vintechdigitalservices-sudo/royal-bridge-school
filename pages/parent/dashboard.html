<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — ROYALBRIDGE INT'L SCHOOL</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-overlay" data-sidebar-overlay></div>
    <aside class="sidebar" data-sidebar>
      <div class="flex items-center justify-between p-md" style="border-bottom:1px solid var(--border)">
        <div class="flex items-center gap-md">
          <img class="brand-logo" data-brand-logo alt="ROYALBRIDGE INT'L SCHOOL logo" />
          <div><div class="font-semibold" data-brand-name>ROYALBRIDGE INT'L SCHOOL</div><div class="text-muted text-xs">Parent</div></div>
        </div>
        <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-close><i class="fas fa-times"></i></button>
      </div>
      <nav class="flex-1" data-sidebar-nav></nav>
      <div class="p-md" style="border-top:1px solid var(--border)"><button class="btn btn-ghost w-full" data-logout><i class="fas fa-sign-out-alt"></i> Logout</button></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="flex items-center gap-md">
          <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-toggle><i class="fas fa-bars"></i></button>
          <h1 class="card-title">Dashboard</h1>
        </div>
        <div class="flex items-center gap-md" data-user-info></div>
      </header>
      <main class="content">
        <div class="card mb-lg">
          <div class="card-header"><h2 class="card-title">My Children</h2></div>
          <div id="children"></div>
        </div>
        <div class="card"><div class="card-body"><p class="text-muted">Monitor fees, payments, results and attendance.</p></div></div>
      </main>
    </div>
    <nav class="bottom-nav" data-bottom-nav></nav>
  </div>
  <script type="module">
    import {initApp} from "../../assets/js/app.js";
    import {requireRole, getCurrentUser} from "../../assets/js/auth.js";
    import {ROLES} from "../../assets/js/config.js";
    import {studentService} from "../../assets/js/services.js";
    import {whenDataReady} from "../../assets/js/data/store.js";
    initApp(); requireRole(ROLES.PARENT);
    const u=getCurrentUser();
    function render(){
      if(!u||!u.parent) return;
      const children=u.parent.children||[];
      const all=studentService.getAll();
      const list=children.map(c=>all.find(s=>s.studentId===c.studentId)).filter(Boolean);
      document.getElementById("children").innerHTML=list.map(s=>`<div class="p-md" style="border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px"><div class="font-semibold">${s.firstName} ${s.lastName}</div><div class="text-muted text-sm">${s.className}${s.classArm?" "+s.classArm:""} • ${s.admissionNumber}</div></div>`).join("")||"<p class='text-muted'>No children linked</p>";
    }
    document.addEventListener("DOMContentLoaded",()=>{render(); whenDataReady().then(render);});
  </script>
</body>
</html>
