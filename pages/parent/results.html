<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results — ROYALBRIDGE INT'L SCHOOL</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-overlay" data-sidebar-overlay></div>
    <aside class="sidebar" data-sidebar>
      <div class="flex items-center justify-between p-md" style="border-bottom:1px solid var(--border)">
        <div class="flex items-center gap-md">
          <img class="brand-logo" data-brand-logo alt="ROYALBRIDGE INT'L SCHOOL logo" />
          <div><div class="font-semibold" data-brand-name>ROYALBRIDGE INT'L SCHOOL</div><div class="text-muted text-xs">Parent</div></div>
        </div>
        <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-close><i class="fas fa-times"></i></button>
      </div>
      <nav class="flex-1" data-sidebar-nav></nav>
      <div class="p-md" style="border-top:1px solid var(--border)"><button class="btn btn-ghost w-full" data-logout><i class="fas fa-sign-out-alt"></i> Logout</button></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="flex items-center gap-md">
          <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-toggle><i class="fas fa-bars"></i></button>
          <h1 class="card-title">Results</h1>
        </div>
        <div class="flex items-center gap-md" data-user-info></div>
      </header>
      <main class="content">
        <div class="card mb-lg">
          <div class="card-header">
            <div class="flex items-center gap-md">
              <select class="form-select" style="max-width:260px" id="childSel"><option value="">Select Child</option></select>
              <select class="form-select" style="max-width:200px" id="termSel"><option value="First Term">First Term</option><option value="Second Term">Second Term</option><option value="Third Term">Third Term</option></select>
            </div>
          </div>
          <div class="table-container">
            <table class="table">
              <thead><tr><th>Subject</th><th>CA</th><th>Exam</th><th>Total</th><th>Grade</th></tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <nav class="bottom-nav" data-bottom-nav></nav>
  </div>
  <script type="module">
    import {initApp} from "../../assets/js/app.js";
    import {requireRole, getCurrentUser} from "../../assets/js/auth.js";
    import {ROLES} from "../../assets/js/config.js";
    import {studentService, resultService, subjectService} from "../../assets/js/services.js";
    import {query} from "../../assets/js/utils.js";
    import {whenDataReady} from "../../assets/js/data/store.js";
    initApp(); requireRole(ROLES.PARENT);
    const u=getCurrentUser();
    function renderChildren(){
      if(!u||!u.parent) return;
      const children=u.parent.children||[];
      const all=studentService.getAll(); const subs=subjectService.getAll().reduce((m,s)=>{m[s.subjectId]=s.name; return m;},{});
      query("#childSel").innerHTML='<option value="">Select Child</option>'+children.map(c=>{
        const s=all.find(x=>x.studentId===c.studentId);
        return `<option value="${c.studentId}">${s?s.firstName+" "+s.lastName:c.studentId}</option>`;
      }).join("");
      function render(){
        const sid=query("#childSel").value, term=query("#termSel").value;
        if(!sid){query("#tbody").innerHTML='<tr><td colspan="5" class="text-center text-muted">Select a child</td></tr>'; return;}
        const results=resultService.getApprovedForStudent(sid,term);
        let rows=[];
        results.forEach(r=>(r.records||[]).forEach(rec=>{ if(rec.studentId===sid) rows.push({subjectId:r.subjectId, ...rec}); }));
        query("#tbody").innerHTML=rows.map(x=>`<tr><td>${subs[x.subjectId]||x.subjectId}</td><td>${x.ca}</td><td>${x.exam}</td><td>${x.total}</td><td>${x.grade}</td></tr>`).join("")||'<tr><td colspan="5" class="text-center text-muted">No approved results</td></tr>';
      }
      query("#childSel").addEventListener("change",render); query("#termSel").addEventListener("change",render); render();
    }
    document.addEventListener("DOMContentLoaded",()=>{ renderChildren(); whenDataReady().then(renderChildren); });
  </script>
</body>
</html>
