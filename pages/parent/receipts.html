<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receipts — ROYALBRIDGE INT'L SCHOOL</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-overlay" data-sidebar-overlay></div>
    <aside class="sidebar" data-sidebar>
      <div class="flex items-center justify-between p-md" style="border-bottom:1px solid var(--border)">
        <div class="flex items-center gap-md">
          <img class="brand-logo" data-brand-logo alt="ROYALBRIDGE INT'L SCHOOL logo" />
          <div><div class="font-semibold" data-brand-name>ROYALBRIDGE INT'L SCHOOL</div><div class="text-muted text-xs">Parent</div></div>
        </div>
        <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-close><i class="fas fa-times"></i></button>
      </div>
      <nav class="flex-1" data-sidebar-nav></nav>
      <div class="p-md" style="border-top:1px solid var(--border)"><button class="btn btn-ghost w-full" data-logout><i class="fas fa-sign-out-alt"></i> Logout</button></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="flex items-center gap-md">
          <button class="btn btn-ghost btn-icon hide-desktop" data-sidebar-toggle><i class="fas fa-bars"></i></button>
          <h1 class="card-title">Receipts</h1>
        </div>
        <div class="flex items-center gap-md" data-user-info></div>
      </header>
      <main class="content">
        <div class="card"><div class="card-body" id="list"></div></div>
      </main>
    </div>
    <nav class="bottom-nav" data-bottom-nav></nav>
  </div>
  <script type="module">import {initApp} from "../../assets/js/app.js"; import {requireRole, getCurrentUser} from "../../assets/js/auth.js"; import {ROLES} from "../../assets/js/config.js"; import {paymentService} from "../../assets/js/services.js"; import {formatCurrency, formatDate} from "../../assets/js/utils.js"; initApp(); requireRole(ROLES.PARENT); document.addEventListener("DOMContentLoaded",()=>{const u=getCurrentUser(); if(!u||!u.parent)return; const child=u.parent.children?.[0]; if(!child){document.getElementById("list").innerHTML="<p class='text-muted'>No child</p>"; return;} const p=paymentService.getByStudent(child.studentId); document.getElementById("list").innerHTML=p.map(x=>`<div class="p-md" style="border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px"><div class="flex justify-between"><span>${x.receiptNumber}</span><span>${formatCurrency(x.amount)}</span></div><div class="text-muted text-sm">${formatDate(x.paymentDate)}</div><button class="btn btn-sm btn-secondary mt-sm" onclick="window.print()">Print</button></div>`).join("")||"<p class='text-muted'>No receipts</p>";});</script>
</body>
</html>
