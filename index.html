<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2340B0" />
  <meta name="description" content="ROYALBRIDGE INT'L SCHOOL portal — Inspiring Excellence" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/images/favicon-192.png" />
  <link rel="apple-touch-icon" href="assets/images/icon-192.png" />
  <title>ROYALBRIDGE INT'L SCHOOL — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>

<body>
  <div class="flex items-center justify-center h-full p-md" style="min-height: 100vh; background: var(--background)">
    <div class="card" style="width: 100%; max-width: 420px">
      <div class="text-center mb-lg">
        <div class="mb-md flex items-center justify-center">
          <img src="assets/images/logo.jpg" alt="ROYALBRIDGE INT'L SCHOOL logo" style="width: 72px; height: 72px; object-fit: contain" />
        </div>
        <h1 class="card-title" data-brand-name>ROYALBRIDGE INT'L SCHOOL</h1>
        <p class="text-muted" data-brand-motto>Inspiring Excellence</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" required placeholder="yourname@royalbridge.edu.ng" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" required placeholder="Enter password" />
        </div>
        <div class="flex items-center justify-between mb-md">
          <label class="flex items-center gap-sm text-sm text-muted">
            <input type="checkbox" id="remember" />
            Remember me
          </label>
          <a href="pages/forgot-password.html" class="text-sm text-primary">Forgot password?</a>
        </div>
        <div id="loginError" class="alert alert-danger mb-md" style="display: none"></div>
        <button class="btn btn-primary w-full" type="submit">
          <i class="fas fa-sign-in-alt"></i>
          Login
        </button>
      </form>

      <div class="text-center mt-md">
        <a href="pages/activate-account.html" class="text-sm text-muted">Activate account</a>
      </div>

      <div class="alert alert-info mt-lg text-sm">
        <strong>Demo credentials</strong> (password for all: <code>password123</code>)<br />
        Admin: admin@royalbridge.edu.ng<br />
        Bursar: bursar@royalbridge.edu.ng<br />
        Teacher: teacher1@royalbridge.edu.ng<br />
        Student: student1@royalbridge.edu.ng
      </div>
    </div>
  </div>

  <script type="module">
    import { login, getCurrentUser, redirectByRole } from "./assets/js/auth.js";
    import { initApp } from "./assets/js/app.js";

    initApp();

    document.addEventListener("DOMContentLoaded", () => {
      const u = getCurrentUser();
      if (u && u.role) {
        redirectByRole(u.role);
        return;
      }
      const form = document.getElementById("loginForm");
      const error = document.getElementById("loginError");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        error.style.display = "none";
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        try {
          await login(email, password);
        } catch (err) {
          error.textContent = err.message || "Login failed";
          error.style.display = "block";
        }
      });
    });
  </script>
</body>

</html>
